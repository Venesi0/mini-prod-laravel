services:
  app:
    build:
      context: ../..
      dockerfile: infra/php/Dockerfile
    container_name: mini-prod-app
    working_dir: /var/www/app
    volumes:
      - ../../app/laravel:/var/www/app
    depends_on:
      - db
    networks:
      - mini-prod-network

  nginx:
    image: nginx:1.27-alpine
    container_name: mini-prod-nginx
    ports:
      - "80:80"
    volumes:
      - ../../app/laravel:/var/www/app:ro
      - ../nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - mini-prod-network

  db:
    image: postgres:17
    container_name: mini-prod-db
    environment:
      POSTGRES_DB: laravel
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: laravelpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mini-prod-network

networks:
  mini-prod-network:

volumes:
  postgres_data:
